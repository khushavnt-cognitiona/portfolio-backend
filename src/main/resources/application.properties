server.port=8080

# Spring Application Name
spring.application.name=portfolio-backend

# Database Configuration (H2 In-Memory for instant local execution & development)
spring.datasource.url=${DB_URL:jdbc:h2:mem:portfoliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
spring.datasource.driverClassName=${DB_DRIVER:org.h2.Driver}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:password}
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# MySQL Configuration (Uncomment/override via environment variables for MySQL production)
# spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/portfolio_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
# spring.datasource.username=${DB_USERNAME:root}
# spring.datasource.password=${DB_PASSWORD:secret}
# spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Properties
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
# For MySQL: spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect

